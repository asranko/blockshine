name: Hesba payment safety tests

on:
  push:
    branches: [hesba-income-tools]
    paths:
      - "hesba_payments.py"
      - "tests/test_hesba_payments.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/hesba-payments-tests.yml"
  pull_request:
    branches: [hesba-income-tools]
    paths:
      - "hesba_payments.py"
      - "tests/test_hesba_payments.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/hesba-payments-tests.yml"

jobs:
  payment-safety:
    runs-on: ubuntu-latest
    env:
      PAYPAL_MODE: sandbox
      HESBA_DOWNLOAD_SECRET: ci-only-secret-not-for-production-2026
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run payment safety regressions
        run: python -m pytest -q tests/test_hesba_payments.py
