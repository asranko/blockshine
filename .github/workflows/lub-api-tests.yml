name: Lub API tests

on:
  push:
    branches: [lub-platform]
  pull_request:
    branches: [lub-platform]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./lub_ci.db
      SECRET_KEY: ci-only-not-a-production-secret
      ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx
      - name: Run API regression tests
        run: python -m pytest -q
