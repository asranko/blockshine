services:
  - type: web
    name: lub-social
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/asranko/blockshine
    branch: lub-platform
    autoDeploy: true
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Reference the existing Render Postgres resource. Do not copy credentials into Git.
      - key: DATABASE_URL
        fromDatabase:
          name: lub-social-db
          property: connectionString
