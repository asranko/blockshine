services:
  - type: web
    name: lub-social
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/asranko/blockshine
    branch: lub-platform
    autoDeploy: true
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt -r requirements-dev.txt && python -m pytest -q
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: TOKEN_HOURS
        value: "24"
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Reference the existing Render Postgres resource. Do not copy credentials into Git.
      - key: DATABASE_URL
        fromDatabase:
          name: lub-social-db
          property: connectionString
